name: heat-extremes

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - xarray
  - netcdf4
  - zarr
  - cartopy
  - jupyter
  - ipykernel
  - matplotlib
  - dask
  - pandas
  - pyyaml
  - pyarrow
  - pytorch
  - gcsfs
  - pip
  - pip:
      # ``pyproject.toml`` is at the repository root, so install this
      # repository—not the import-package subdirectory—in editable mode.
      - -e .
